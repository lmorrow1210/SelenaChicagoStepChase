name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: one_step_ahead_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck api
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Test api (unit + integration)
        run: npm run test -w apps/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/one_step_ahead_test
      - name: Build web
        run: npm run build -w apps/web
      # Design-token adherence (plan §7 / hard rule 4): app code must use
      # tokens, never raw hex. (The design-system bundle itself holds the hex
      # constants, so only app code is gated. oxlint can't run the original
      # _adherence.oxlintrc.json — no no-restricted-syntax support — so this
      # enforces the load-bearing rule directly.)
      - name: OpenAPI generated types in sync
        run: |
          npm run gen:api-types -w apps/web
          git diff --exit-code apps/web/lib/api-types.d.ts
      - name: Design-token adherence (no raw hex in app code)
        # lib/brand.ts is the ONE sanctioned hex location — web manifests and
        # theme-color meta cannot resolve CSS custom properties.
        run: |
          if grep -rEn '#[0-9a-fA-F]{3,8}\b' apps/web/app apps/web/lib --include='*.tsx' --include='*.ts' --exclude=brand.ts; then
            echo '::error::Raw hex color in app code — use a design-system token via var(--…) or lib/brand.ts'
            exit 1
          fi
      - name: Lore scope guard (no parked lore in app code)
        run: |
          if grep -rniE '\bmeridian\b|bureau conspiracy|same node' packages/shared/src apps/web/lib apps/web/app; then
            echo '::error::Parked lore found in shipped app/shared code'
            exit 1
          fi
      - name: WCAG contrast audit (v2 palette)
        run: node scripts/contrast-audit.mjs

  static-demo-export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo_week: [1, 2, 13]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static demo export for Week ${{ matrix.demo_week }}
        run: npm run build -w apps/web
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_DEMO_WEEK: ${{ matrix.demo_week }}
          NEXT_PUBLIC_BASE_PATH: /SelenaChicagoStepChase
          NEXT_PUBLIC_API_URL: https://example.invalid
